networks:
  satellite-net:
    driver: bridge

services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: satellite-server:1.0.0
    container_name: server
    environment:
      SERVER_PORT: "8082"
    ports:
      - "8082:8082"
    networks:
      - satellite-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  mission-service:
    build:
      context: .
      dockerfile: mission-service/Dockerfile
    image: satellite-mission-service:1.0.0
    container_name: mission-service
    depends_on:
      server:
        condition: service_healthy
    environment:
      SERVER_PORT: "8083"
      SERVER_URL: "http://server:8082"
    ports:
      - "8083:8083"
    networks:
      - satellite-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8083/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
