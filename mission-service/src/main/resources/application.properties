server.port=${SERVER_PORT:8083}
spring.application.name=mission-service
spring.main.banner-mode=off

# Базовый URL центра управления — только из окружения / свойств, без захардкоженных хостов в коде
app.server.base-url=${SERVER_URL:http://localhost:8082}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
# Страница центра (/test.html на :8082) запрашивает health миссий с другого порта — нужен CORS для actuator
management.endpoints.web.cors.allowed-origin-patterns=http://localhost:*,http://127.0.0.1:*
management.endpoints.web.cors.allowed-methods=GET,OPTIONS

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
