# Server configuration
server.port=8082
spring.main.web-application-type=servlet
# Spring configuration
spring.application.name=mission-scheduler
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
spring.main.banner-mode=off

# Logging configuration
logging.charset.console=UTF-8
logging.charset.file=UTF-8
logging.level.com.satellite.scheduler=DEBUG
logging.level.org.springframework.web=INFO

# Space Center Service configuration
app.space-center-service.url=http://localhost:8082/api

# Mission 1: GeoStationary constellation - every 6 hours
app.space-center-service.missions[0].targetType=CONSTELLATION
app.space-center-service.missions[0].constellationName=GeoStationary
app.space-center-service.missions[0].cron=0 0 */6 * * *

# Mission 2: LowOrbit single satellite - every Monday at 8:30
app.space-center-service.missions[1].targetType=SINGLE_SATELLITE
app.space-center-service.missions[1].constellationName=LowOrbit
app.space-center-service.missions[1].satelliteName=Sat-1
app.space-center-service.missions[1].cron=0 30 8 * * MON

# Mission 3: TestConstellation - every minute for testing
app.space-center-service.missions[2].targetType=CONSTELLATION
app.space-center-service.missions[2].constellationName=TestConstellation
app.space-center-service.missions[2].cron=0 */1 * * * *