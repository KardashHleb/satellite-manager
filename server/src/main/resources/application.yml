server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: satellite-server
  main:
    banner-mode: "off"
    web-application-type: servlet
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/satellite_db}
    username: ${SPRING_DATASOURCE_USERNAME:satellite}
    password: ${SPRING_DATASOURCE_PASSWORD:satellite}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  console:
    menu:
      enabled: ${APP_CONSOLE_MENU_ENABLED:true}
  test:
    mode: ${TEST_MODE:false}

logging:
  charset:
    console: UTF-8
    file: UTF-8
  level:
    org.springframework.web: INFO

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    defaults:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

grpc:
  client:
    telemetry-service:
      address: ${TELEMETRY_GRPC_ADDRESS:static://localhost:9091}
      negotiationType: plaintext
