# The port is set with SERVER_PORT (Docker / environment)
server.port=${SERVER_PORT:8082}
# Console menu: set APP_CONSOLE_MENU_ENABLED=false in Docker
app.console.menu.enabled=${APP_CONSOLE_MENU_ENABLED:true}
test.mode=${TEST_MODE:false}
spring.main.web-application-type=servlet
spring.application.name=satellite-server
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
spring.main.banner-mode=off

logging.charset.console=UTF-8
logging.charset.file=UTF-8
logging.level.org.springframework.web=INFO

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.health.defaults.enabled=true

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
