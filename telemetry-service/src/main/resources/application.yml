server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: telemetry-service
  main:
    banner-mode: "off"
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/satellite_db}
    username: ${SPRING_DATASOURCE_USERNAME:satellite}
    password: ${SPRING_DATASOURCE_PASSWORD:satellite}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    table: flyway_telemetry_schema_history
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: telemetry-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.satellite.events
        spring.json.value.default.type: com.satellite.events.SatelliteLifecycleEvent
        spring.json.use.type.headers: false

grpc:
  server:
    port: 9091

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
